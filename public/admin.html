    <script>
        const API_BASE = '/api';
        const authToken = localStorage.getItem('token');
        let allArticles = [];
        let allCategories = [];
        let allDiscussions = [];

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        async function loadData() {
            try {
                const [articlesRes, categoriesRes, discussionsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/articles`),
                    fetch(`${API_BASE}/api/categories`),
                    fetch(`${API_BASE}/api/discussions`)
                ]);
                allArticles = await articlesRes.json();
                allCategories = await categoriesRes.json();
                allDiscussions = await discussionsRes.json();
            } catch (err) {
                console.error('加载数据失败', err);
            }
        }

        function renderStats() {
            document.getElementById('statArticles').textContent = allArticles.length;
            document.getElementById('statViews').textContent = allArticles.reduce((sum, a) => sum + (a.views || 0), 0);
            document.getElementById('statFavorites').textContent = allArticles.filter(a => a.isFavorite).length;
            document.getElementById('statCategories').textContent = allCategories.length;
        }

        function renderArticleList() {
            const container = document.getElementById('articleList');
            if (allArticles.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        <p>暂无文章，点�?新建文章"按钮添加</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = allArticles.map(article => `
                <div class="article-item">
                    <div class="article-info">
                        <div class="article-title">${article.title}</div>
                        <div class="article-meta">${article.category} · ${article.author} · ${formatDate(article.created_at)} · 浏览 ${article.views || 0}</div>
                    </div>
                    <div class="article-actions">
                        <button class="btn btn-default action-btn" onclick="editArticle(${article.id})">编辑</button>
                        <button class="btn btn-danger action-btn" onclick="deleteArticle(${article.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryList');
            container.innerHTML = allCategories.map(cat => {
                const count = allArticles.filter(a => a.category === cat.name).length;
                return `
                    <div class="category-item">
                        <div class="category-name">
                            <span>📁</span>
                            <span>${cat.name}</span>
                        </div>
                        <span class="category-count">${count}</span>
                    </div>
                `;
            }).join('');
        }

        function renderCategoryOptions() {
            const select = document.getElementById('articleCategory');
            select.innerHTML = allCategories.map(cat =>
                `<option value="${cat.name}">${cat.name}</option>`
            ).join('');
        }

        function openModal(isEdit = false) {
            document.getElementById('articleModal').classList.add('active');
            document.getElementById('modalTitle').textContent = isEdit ? '编辑文章' : '新建文章';
            renderCategoryOptions();
            if (!isEdit) {
                document.getElementById('articleId').value = '';
                document.getElementById('articleTitle').value = '';
                document.getElementById('articleSummary').value = '';
                document.getElementById('articleContent').value = '';
            }
        }

        function closeModal() {
            document.getElementById('articleModal').classList.remove('active');
        }

        async function saveArticle() {
            const id = document.getElementById('articleId').value;
            const title = document.getElementById('articleTitle').value.trim();
            const category = document.getElementById('articleCategory').value;
            const summary = document.getElementById('articleSummary').value.trim();
            const content = document.getElementById('articleContent').value.trim();

            if (!title) { alert('请输入文章标�?); return; }
            if (!summary) { alert('请输入文章摘�?); return; }
            if (!content) { alert('请输入文章内�?); return; }

            const data = { title, category, summary, content };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_BASE}/api/articles/${id}` : `${API_BASE}/api/articles`;

            try {
                await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(data)
                });
                closeModal();
                await loadData();
                renderStats();
                renderArticleList();
                renderCategoryList();
                alert(id ? '文章已更�? : '文章已创�?);
            } catch (err) {
                alert('保存失败，请重试');
            }
        }

        async function editArticle(id) {
            const article = allArticles.find(a => a.id === id);
            if (article) {
                document.getElementById('articleId').value = article.id;
                document.getElementById('articleTitle').value = article.title;
                renderCategoryOptions();
                document.getElementById('articleCategory').value = article.category;
                document.getElementById('articleSummary').value = article.summary;
                document.getElementById('articleContent').value = article.content;
                openModal(true);
            }
        }

        async function deleteArticle(id) {
            if (!confirm('确定要删除这篇文章吗？此操作不可恢复�?)) return;
            try {
                await fetch(`${API_BASE}/api/articles/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                await loadData();
                renderStats();
                renderArticleList();
                renderCategoryList();
            } catch (err) {
                alert('删除失败');
            }
        }

        function renderDiscussions() {
            const container = document.getElementById('adminDiscussionList');
            if (allDiscussions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                        <p>暂无用户留言</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = allDiscussions.map(d => `
                <div class="discussion-item">
                    <div class="discussion-header">
                        <div class="discussion-avatar" style="background: #1677ff">${(d.username || 'U').charAt(0).toUpperCase()}</div>
                        <div class="discussion-meta">
                            <div class="discussion-author">${d.username || '用户'}</div>
                            <div class="discussion-time">${formatDate(d.created_at)}</div>
                        </div>
                        <span class="discussion-type ${d.status === 'replied' ? 'type-share' : 'type-request'}">${d.status === 'replied' ? '�?已回�? : '📚 待回�?}</span>
                    </div>
                    <div class="discussion-content">${escapeHtml(d.content)}</div>
                    ${renderAdminReplies(d)}
                    <div class="discussion-footer">
                        <button class="btn btn-primary" style="padding: 6px 16px; font-size: 13px;" onclick="openReplyModal(${d.id})">
                            <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: white; vertical-align: middle; margin-right: 4px;"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
                            回复
                        </button>
                        <button class="btn btn-danger" style="padding: 6px 16px; font-size: 13px;" onclick="deleteDiscussion(${d.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAdminReplies(discussion) {
            if (!discussion.reply) return '';
            return `
                <div class="discussion-replies">
                    <div class="discussion-reply">
                        <span class="reply-author">${discussion.replied_by || '管理�?}</span>
                        <span class="reply-time">${formatDate(discussion.replied_at)}</span>
                        <div style="margin-top: 4px;">${escapeHtml(discussion.reply)}</div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openReplyModal(id) {
            const discussion = allDiscussions.find(d => d.id === id);
            if (discussion) {
                document.getElementById('replyPostId').value = id;
                document.getElementById('originalContent').textContent = discussion.content;
                document.getElementById('replyContent').value = '';
                document.getElementById('replyModal').classList.add('active');
            }
        }

        function closeReplyModal() {
            document.getElementById('replyModal').classList.remove('active');
        }

        async function submitReply() {
            const postId = parseInt(document.getElementById('replyPostId').value);
            const reply = document.getElementById('replyContent').value.trim();
            if (!reply) { alert('请输入回复内�?); return; }

            try {
                await fetch(`${API_BASE}/api/discussions/${postId}/reply`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ reply })
                });
                closeReplyModal();
                await loadData();
                renderDiscussions();
                alert('回复成功�?);
            } catch (err) {
                alert('回复失败');
            }
        }

        async function deleteDiscussion(id) {
            if (!confirm('确定要删除这条留言吗？')) return;
            try {
                await fetch(`${API_BASE}/api/discussions/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                await loadData();
                renderDiscussions();
            } catch (err) {
                alert('删除失败');
            }
        }

        // 初始�?        (function() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                const avatar = document.getElementById('userAvatar');
                if (avatar && user.username) {
                    avatar.textContent = user.username.charAt(0).toUpperCase();
                }
            }

            document.getElementById('navSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const keyword = this.value.trim();
                    if (keyword) {
                        window.location.href = 'index.html?search=' + encodeURIComponent(keyword);
                    }
                }
            });

            document.getElementById('articleModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            loadData().then(() => {
                renderStats();
                renderArticleList();
                renderCategoryList();
                renderDiscussions();
            });
        })();
    </script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW:",e))}</script></body>
</html>
