  function getAuth() {
    const token = localStorage.getItem('token')
    if (!token) return null
    try { return JSON.parse(atob(token)) } catch { return null }
  }

  async function supa(path, options = {}) {
    const url = SUPABASE_URL + '/rest/v1' + path
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    }
    if (options.prefer) headers['Prefer'] = options.prefer
    return fetch(url, {
      method: options.method || 'GET',
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    })
  }

  function jsonResponse(data, status) {
    return new Response(JSON.stringify(data), {
      status: status || 200,
      headers: { 'Content-Type': 'application/json' }
    })
  }

  function notFound() { return jsonResponse({ error: 'Not Found' }, 404) }
  function unauthorized(msg) { return jsonResponse({ error: msg || '未登�? }, 401) }
  function forbidden() { return jsonResponse({ error: '无权�? }, 403) }

  const originalFetch = window.fetch.bind(window)

  window.fetch = async function(input, init) {
    let url, request
    if (typeof input === 'string') {
      url = new URL(input, location.origin)
    } else if (input instanceof Request) {
      url = new URL(input.url, location.origin)
    } else if (input instanceof URL) {
      url = input
    } else {
      return originalFetch(input, init)
    }

    // 只处理同�?/api/* 请求
    if (url.origin !== location.origin || !url.pathname.startsWith('/api/')) {
      return originalFetch(input, init)
    }

    const path = url.pathname.replace('/api', '')
    const method = (init && init.method) || (input.method) || 'GET'
    let body
    if (init && init.body) {
      try { body = JSON.parse(init.body) } catch { body = init.body }
    } else if (input instanceof Request && input.body) {
      try { body = await input.clone().json() } catch {}

        let q = '/articles?order=created_at.desc'

        const search = url.searchParams.get('search')

          data = data.filter(function(a) { return (a.title || '').toLowerCase().includes(s) || (a.content || '').toLowerCase().includes(s) })

        if (!arr || arr.length === 0) return jsonResponse({ error: '文章不存�? }, 404)

        supa('/articles?id=eq.' + m[1], { method: 'PATCH', body: { views: (a.views || 0) + 1 } })

        if (user.role !== 'admin') return forbidden()

          method: 'POST',
          body: { title: body.title, content: body.content, summary: body.summary || '', category: body.category, author: user.username, views: 0, created_at: new Date().toISOString().split('T')[0] },
          prefer: 'return=representation'

        const arr = await r.json()
        return jsonResponse({ id: arr[0].id, message: '创建成功' }, 201)
      }

        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        await supa('/articles?id=eq.' + m[1], { method: 'PATCH', body: { title: body.title, content: body.content, summary: body.summary, category: body.category } })

      }

      // 删除文章
      if ((m = path.match(/^\/articles\/(\d+)$/)) && method === 'DELETE') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        await supa('/articles?id=eq.' + m[1], { method: 'DELETE' })
        await supa('/favorites?article_id=eq.' + m[1], { method: 'DELETE' })
        return jsonResponse({ message: '删除成功' })
      }

      // 分类
      if (path === '/categories' && method === 'GET') {
        const r = await supa('/categories?order=sort_order.asc')
        return jsonResponse(await r.json())
      }

      // 收藏列表
      if (path === '/favorites' && method === 'GET') {
        if (!user) return unauthorized()
        const r1 = await supa('/favorites?user_id=eq.' + user.userId + '&select=article_id,created_at')
        const favs = await r1.json()
        if (!favs || favs.length === 0) return jsonResponse([])
        const ids = favs.map(function(f) { return f.article_id }).join(',')
        const r2 = await supa('/articles?id=in.(' + ids + ')')
        const articles = await r2.json()
        const result = articles.map(function(a) {
          const fav = favs.find(function(f) { return f.article_id === a.id })
          return Object.assign({}, a, { favorite_at: fav && fav.created_at })
        })
        return jsonResponse(result)
      }

      if ((m = path.match(/^\/favorites\/(\d+)$/)) && method === 'POST') {

        return jsonResponse({ message: '收藏成功' })
      }

      // 取消收藏
      if ((m = path.match(/^\/favorites\/(\d+)$/)) && method === 'DELETE') {
        if (!user) return unauthorized()
        await supa('/favorites?user_id=eq.' + user.userId + '&article_id=eq.' + m[1], { method: 'DELETE' })
        return jsonResponse({ message: '取消收藏' })
      }

        if (!user) return unauthorized()

          method: 'POST',
          body: { user_id: user.userId, username: user.username, content: body.content, reply: null, replied_by: null, replied_at: null, status: 'pending' }

      if ((m = path.match(/^\/articles\/(\d+)$/)) && method === 'GET') {
        const r = await supa('/articles?id=eq.' + m[1] + '&select=*')
        const arr = await r.json()
        if (!arr || arr.length === 0) return jsonResponse({ error: '文章不存�? }, 404)
        const a = arr[0]
        supa('/articles?id=eq.' + m[1], { method: 'PATCH', body: { views: (a.views || 0) + 1 } })
        return jsonResponse(Object.assign({}, a, { views: (a.views || 0) + 1 }))
      }

      // 创建文章
      if (path === '/articles' && method === 'POST') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        const r = await supa('/articles', {
          method: 'POST',
          body: { title: body.title, content: body.content, summary: body.summary || '', category: body.category, author: user.username, views: 0, created_at: new Date().toISOString().split('T')[0] },
          prefer: 'return=representation'
        })
        const arr = await r.json()
        return jsonResponse({ id: arr[0].id, message: '创建成功' }, 201)
      }

      // 更新文章
      if ((m = path.match(/^\/articles\/(\d+)$/)) && method === 'PUT') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        await supa('/articles?id=eq.' + m[1], { method: 'PATCH', body: { title: body.title, content: body.content, summary: body.summary, category: body.category } })
        return jsonResponse({ message: '更新成功' })
      }

      // 删除文章
      if ((m = path.match(/^\/articles\/(\d+)$/)) && method === 'DELETE') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        await supa('/articles?id=eq.' + m[1], { method: 'DELETE' })
        await supa('/favorites?article_id=eq.' + m[1], { method: 'DELETE' })
        return jsonResponse({ message: '删除成功' })
      }

      // 分类
      if (path === '/categories' && method === 'GET') {
        const r = await supa('/categories?order=sort_order.asc')
        return jsonResponse(await r.json())
      }

      // 收藏列表
      if (path === '/favorites' && method === 'GET') {
        if (!user) return unauthorized()
        const r1 = await supa('/favorites?user_id=eq.' + user.userId + '&select=article_id,created_at')
        const favs = await r1.json()
        if (!favs || favs.length === 0) return jsonResponse([])
        const ids = favs.map(function(f) { return f.article_id }).join(',')
        const r2 = await supa('/articles?id=in.(' + ids + ')')
        const articles = await r2.json()
        const result = articles.map(function(a) {
          const fav = favs.find(function(f) { return f.article_id === a.id })
          return Object.assign({}, a, { favorite_at: fav && fav.created_at })
        })
        return jsonResponse(result)
      }

      // 添加收藏
      if ((m = path.match(/^\/favorites\/(\d+)$/)) && method === 'POST') {
        if (!user) return unauthorized()
        const r1 = await supa('/favorites?user_id=eq.' + user.userId + '&article_id=eq.' + m[1] + '&select=id')
        const exist = await r1.json()
        if (exist && exist.length > 0) return jsonResponse({ error: '已收�? }, 400)
        await supa('/favorites', { method: 'POST', body: { user_id: user.userId, article_id: parseInt(m[1]) } })
        return jsonResponse({ message: '收藏成功' })
      }

      // 取消收藏
      if ((m = path.match(/^\/favorites\/(\d+)$/)) && method === 'DELETE') {
        if (!user) return unauthorized()
        await supa('/favorites?user_id=eq.' + user.userId + '&article_id=eq.' + m[1], { method: 'DELETE' })
        return jsonResponse({ message: '取消收藏' })
      }

      // 留言提交
      if (path === '/discussions' && method === 'POST') {
        if (!user) return unauthorized()
        await supa('/discussions', {
          method: 'POST',
          body: { user_id: user.userId, username: user.username, content: body.content, reply: null, replied_by: null, replied_at: null, status: 'pending' }
        })
        return jsonResponse({ message: '提交成功' })
      }

      // 留言列表
      if (path === '/discussions' && method === 'GET') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        const r = await supa('/discussions?order=id.desc')
        return jsonResponse(await r.json())
      }

      // 回复留言
      if ((m = path.match(/^\/discussions\/(\d+)\/reply$/)) && method === 'PUT') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        await supa('/discussions?id=eq.' + m[1], { method: 'PATCH', body: { reply: body.reply, replied_by: user.username, replied_at: new Date().toISOString(), status: 'replied' } })
        return jsonResponse({ message: '回复成功' })
      }

      // 删除留言
      if ((m = path.match(/^\/discussions\/(\d+)$/)) && method === 'DELETE') {
        if (!user) return unauthorized()
        if (user.role !== 'admin') return forbidden()
        await supa('/discussions?id=eq.' + m[1], { method: 'DELETE' })
        return jsonResponse({ message: '删除成功' })
      }

      return notFound()
    } catch (err) {
      return jsonResponse({ error: err.message || String(err) }, 500)
    }
  }
})()</script>
        
        const authToken = localStorage.getItem('token');
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');

        async function submitMessage() {
            const content = document.getElementById('messageContent').value.trim();
            if (!content) {
                alert('请输入留言内容');
                return;
            }
            if (!authToken) {
                alert('请先登录');
                return;
            }
            
            const btn = document.querySelector('.submit-btn');
            btn.disabled = true;
            btn.textContent = '发布�?..';
            
            try {
                const res = await fetch(`${API_BASE}/api/discussions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ content })
                });
                
                if (!res.ok) {
                    const data = await res.json();
                    alert(data.error || '发布失败');
                    btn.disabled = false;
                    btn.textContent = '发布留言';
                    return;
                }
                
                document.getElementById('messageContent').value = '';
                document.getElementById('successTip').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('successTip').style.display = 'none';
                }, 5000);
            } catch (err) {
                alert('网络错误，请重试');
            }
            btn.disabled = false;
            btn.textContent = '发布留言';
        }

        // 标签切换
        document.querySelectorAll('.post-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.post-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 初始�?        (function() {
            if (currentUser) {
                const avatar = document.getElementById('userAvatar');
                if (avatar) avatar.textContent = currentUser.username.charAt(0).toUpperCase();
                const postAvatar = document.getElementById('postAvatar');
                if (postAvatar) postAvatar.textContent = currentUser.username.charAt(0).toUpperCase();
                const postUsername = document.getElementById('postUsername');
                if (postUsername) postUsername.textContent = currentUser.username;
            }

            document.getElementById('navSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const keyword = this.value.trim();
                    if (keyword) {
                        window.location.href = 'index.html?search=' + encodeURIComponent(keyword);
                    }
                }
            });
        })();
    </script>
