    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5; min-height: 100vh;
        }
        .navbar {
            background: #2c3e50; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; position: sticky; top: 0; z-index: 100;
        }
        .nav-left { display: flex; align-items: center; gap: 32px; }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            color: white; font-size: 16px; font-weight: 500; text-decoration: none;
        }
        .nav-brand svg { width: 20px; height: 20px; fill: white; }
        .nav-menu { display: flex; gap: 8px; }
        .nav-item {
            padding: 8px 16px; color: rgba(255,255,255,0.85); font-size: 14px;
            cursor: pointer; border-radius: 4px; transition: all 0.2s; text-decoration: none;
        }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-item.active { color: white; background: rgba(255,255,255,0.15); }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .search-box {
            display: flex; align-items: center; background: rgba(255,255,255,0.1);
            border-radius: 4px; padding: 6px 12px; gap: 8px;
        }
        .search-box svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.6); }
        .search-box input {
            background: transparent; border: none; color: white;
            font-size: 13px; width: 140px; outline: none;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        .user-avatar {
            width: 32px; height: 32px; background: #5a6c7d; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 13px;
        }
        .breadcrumb {
            background: white; padding: 12px 24px;
            border-bottom: 1px solid #e8e8e8; font-size: 13px; color: #666;
        }
        .breadcrumb a { color: #1677ff; text-decoration: none; }
        .main-content { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
        .welcome-card {
            background: white; border-radius: 12px; padding: 24px 32px;
            margin-bottom: 24px;
        }
        .welcome-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 600; color: #1a1a1a;
        }
        .welcome-title svg { width: 24px; height: 24px; fill: #1677ff; }
        .welcome-desc {
            font-size: 14px; color: #666; margin-top: 8px;
        }
        .post-card {
            background: white; border-radius: 12px; padding: 24px 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .post-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
        }
        .user-avatar-large {
            width: 40px; height: 40px; background: #1677ff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 500;
        }
        .user-info-line {
            display: flex; flex-direction: column; gap: 2px;
        }
        .user-name { font-size: 14px; color: #1a1a1a; font-weight: 500; }
        .user-desc { font-size: 12px; color: #999; }
        .post-tags {
            display: flex; gap: 8px; margin-bottom: 16px;
        }
        .post-tag {
            padding: 6px 12px; border: 1px solid #e8e8e8; border-radius: 6px;
            font-size: 13px; color: #666; cursor: pointer; transition: all 0.2s;
        }
        .post-tag:hover { border-color: #1677ff; color: #1677ff; }
        .post-tag.active { background: #e6f7ff; border-color: #1677ff; color: #1677ff; }
        .post-textarea {
            width: 100%; min-height: 120px; padding: 12px 16px;
            border: 1px solid #e8e8e8; border-radius: 8px;
            font-size: 14px; font-family: inherit; resize: vertical;
            outline: none; transition: border-color 0.2s;
        }
        .post-textarea:focus { border-color: #1677ff; }
        .post-actions {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 16px;
        }
        .post-tools {
            display: flex; gap: 16px; color: #999; font-size: 13px;
        }
        .post-tool {
            display: flex; align-items: center; gap: 4px; cursor: pointer;
        }
        .post-tool svg { width: 16px; height: 16px; fill: currentColor; }
        .submit-btn {
            padding: 10px 28px; background: #0d7a3d; color: white;
            border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: #0a6b35; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
        .success-tip {
            margin-top: 16px; padding: 12px 20px;
            background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 8px;
            display: flex; align-items: center; gap: 8px;
            color: #1677ff; font-size: 14px;
        }
        .success-tip svg { width: 18px; height: 18px; fill: #1677ff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">

                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                企业知识�?            </a>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">首页</a>
                <a href="favorites.html" class="nav-item">我的收藏</a>
                <a href="discussion.html" class="nav-item active">知识交流�?/a>
                <a href="admin.html" class="nav-item">管理后台</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="快速搜索知�? id="navSearch">
            </div>
            <div class="user-avatar" id="userAvatar">�?/div>
        </div>
    </nav>

    <div class="breadcrumb">
        <a href="index.html">知识�?/a> / 留言反馈
    </div>

    <div class="main-content">
        <div class="welcome-card">
            <div class="welcome-title">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                留言反馈
            </div>
            <div class="welcome-desc">请描述你需要学习的知识内容，或详细说明你遇到的问题，管理员将在后台查看并回�?/div>
        </div>

        <div class="post-card">
            <div class="post-header">
                <div class="user-avatar-large" id="postAvatar">�?/div>
                <div class="user-info-line">
                    <div class="user-name" id="postUsername">系统管理�?/div>
                    <div class="user-desc">分享你的学习需求或提出问题</div>
                </div>
            </div>
            <div class="post-tags">
                <div class="post-tag active">📚 知识索求</div>
                <div class="post-tag">�?问题求助</div>
                <div class="post-tag">💡 经验分享</div>
            </div>
            <textarea class="post-textarea" id="messageContent" placeholder="请描述你需要学习的知识内容，或详细说明你遇到的问题..."></textarea>
            <div class="post-actions">
                <div class="post-tools">
                    <div class="post-tool">
                        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                        添加附件
                    </div>
                </div>
                <button class="submit-btn" onclick="submitMessage()">发布留言</button>
            </div>
            <div class="success-tip" id="successTip" style="display:none">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                您的留言已提交，管理员将在后台查看并回复，请留意后续更新
            </div>
        </div>
    </div>

    <script>
        
        const authToken = localStorage.getItem('token');
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');

        async function submitMessage() {
            const content = document.getElementById('messageContent').value.trim();
            if (!content) {
                alert('请输入留言内容');
                return;
            }
            if (!authToken) {
                alert('请先登录');
                return;
            }
            
            const btn = document.querySelector('.submit-btn');
            btn.disabled = true;
            btn.textContent = '发布�?..';
            
            try {
                const res = await fetch(`${API_BASE}/api/discussions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ content })
                });
                
                if (!res.ok) {
                    const data = await res.json();
                    alert(data.error || '发布失败');
                    btn.disabled = false;
                    btn.textContent = '发布留言';
                    return;
                }
                
                document.getElementById('messageContent').value = '';
                document.getElementById('successTip').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('successTip').style.display = 'none';
                }, 5000);
            } catch (err) {
                alert('网络错误，请重试');
            }
            btn.disabled = false;
            btn.textContent = '发布留言';
        }

        // 标签切换
        document.querySelectorAll('.post-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.post-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 初始�?        (function() {
            if (currentUser) {
                const avatar = document.getElementById('userAvatar');
                if (avatar) avatar.textContent = currentUser.username.charAt(0).toUpperCase();
                const postAvatar = document.getElementById('postAvatar');
                if (postAvatar) postAvatar.textContent = currentUser.username.charAt(0).toUpperCase();
                const postUsername = document.getElementById('postUsername');
                if (postUsername) postUsername.textContent = currentUser.username;
            }

            document.getElementById('navSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const keyword = this.value.trim();
                    if (keyword) {
                        window.location.href = 'index.html?search=' + encodeURIComponent(keyword);
                    }
                }
            });
        })();
    </script>
