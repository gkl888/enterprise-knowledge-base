<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 企业知识库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5; min-height: 100vh;
        }
        .navbar {
            background: #2c3e50; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; position: sticky; top: 0; z-index: 100;
        }
        .nav-left { display: flex; align-items: center; gap: 32px; }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            color: white; font-size: 16px; font-weight: 500; text-decoration: none;
        }
        .nav-brand svg { width: 20px; height: 20px; fill: white; }
        .nav-menu { display: flex; gap: 8px; }
        .nav-item {
            padding: 8px 16px; color: rgba(255,255,255,0.85); font-size: 14px;
            cursor: pointer; border-radius: 4px; transition: all 0.2s; text-decoration: none;
        }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-item.active { color: white; background: rgba(255,255,255,0.15); }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .search-box {
            display: flex; align-items: center; background: rgba(255,255,255,0.1);
            border-radius: 4px; padding: 6px 12px; gap: 8px;
        }
        .search-box svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.6); }
        .search-box input {
            background: transparent; border: none; color: white;
            font-size: 13px; width: 140px; outline: none;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        .user-avatar {
            width: 32px; height: 32px; background: #5a6c7d; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 13px;
        }
        .breadcrumb {
            background: white; padding: 12px 24px;
            border-bottom: 1px solid #e8e8e8; font-size: 13px; color: #666;
        }
        .breadcrumb a { color: #1677ff; text-decoration: none; }
        .main-content { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
        .welcome-card {
            background: white; border-radius: 12px; padding: 24px 32px;
            margin-bottom: 24px;
        }
        .welcome-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 20px; font-weight: 600; color: #1a1a1a;
        }
        .welcome-title svg { width: 24px; height: 24px; fill: #ff4d4f; }
        .welcome-desc {
            font-size: 14px; color: #666; margin-top: 8px;
        }
        .article-list-card {
            background: white; border-radius: 12px; overflow: hidden;
        }
        .article-item {
            padding: 20px 24px; border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s; cursor: pointer;
        }
        .article-item:last-child { border-bottom: none; }
        .article-item:hover { background: #fafafa; }
        .article-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
        }
        .article-title {
            font-size: 15px; font-weight: 500; color: #1677ff;
            text-decoration: none;
        }
        .article-title:hover { text-decoration: underline; }
        .article-views {
            display: flex; align-items: center; gap: 6px; font-size: 13px; color: #999;
        }
        .article-views svg { width: 14px; height: 14px; fill: #999; }
        .article-summary {
            font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 12px;
        }
        .article-meta {
            display: flex; align-items: center; gap: 12px;
        }
        .article-tag {
            padding: 4px 12px; background: #f5f5f5; border-radius: 4px;
            font-size: 12px; color: #666;
        }
        .article-author {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; color: #999;
        }
        .author-avatar {
            width: 20px; height: 20px; background: #e8e8e8; border-radius: 50%;
        }
        .article-date { font-size: 13px; color: #999; }
        .empty-state {
            text-align: center; padding: 80px 20px;
        }
        .empty-state svg { width: 80px; height: 80px; fill: #d9d9d9; margin-bottom: 16px; }
        .empty-state h3 { font-size: 16px; color: #666; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: #999; margin-bottom: 24px; }
        .browse-btn {
            display: inline-block; padding: 10px 24px;
            background: #1677ff; color: white;
            border-radius: 6px; text-decoration: none; font-size: 14px;
        }
        .browse-btn:hover { background: #0958d9; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="nav-brand">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                企业知识库
            </a>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">首页</a>
                <a href="favorites.html" class="nav-item active">我的收藏</a>
                <a href="discussion.html" class="nav-item">知识交流池</a>
                <a href="admin.html" class="nav-item">管理后台</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="快速搜索知识" id="navSearch">
            </div>
            <div class="user-avatar" id="userAvatar">系</div>
        </div>
    </nav>

    <div class="breadcrumb">
        <a href="index.html">知识库</a> / 我的收藏
    </div>

    <div class="main-content">
        <div class="welcome-card">
            <div class="welcome-title">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                我的收藏
            </div>
            <div class="welcome-desc">您收藏的文章将在这里显示，方便快速查阅</div>
        </div>
        <div class="article-list-card" id="favoritesList"></div>
    </div>

    <script>
        const API_BASE = '/api';
        const authToken = localStorage.getItem('token');
        const currentUser = JSON.parse(localStorage.getItem('user') || 'null');

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        async function loadFavorites() {
            const container = document.getElementById('favoritesList');
            
            if (!authToken) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <h3>暂无收藏</h3>
                        <p>请先登录后查看收藏</p>
                        <a href="index.html" class="browse-btn">去浏览文章</a>
                    </div>
                `;
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/favorites`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const favorites = await res.json();
                
                if (favorites.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <h3>暂无收藏</h3>
                            <p>在文章详情页点击"收藏"按钮，即可将文章添加到此页</p>
                            <a href="index.html" class="browse-btn">去浏览文章</a>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = favorites.map(a => `
                    <div class="article-item" onclick="location.href='article.html?id=${a.id}'">
                        <div class="article-header">
                            <a href="article.html?id=${a.id}" class="article-title" onclick="event.stopPropagation()">${a.title}</a>
                            <div class="article-views">
                                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                ${a.views || 0}
                            </div>
                        </div>
                        <div class="article-summary">${a.summary || ''}</div>
                        <div class="article-meta">
                            <span class="article-tag">${a.category}</span>
                            <div class="article-author">
                                <div class="author-avatar"></div>
                                <span>作者：${a.author}</span>
                            </div>
                            <span class="article-date">收藏于 ${formatDate(a.favorite_at || a.created_at)}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>加载失败</h3>
                        <p>请检查网络后重试</p>
                    </div>
                `;
            }
        }

        // 初始化
        (function() {
            if (currentUser) {
                const avatar = document.getElementById('userAvatar');
                if (avatar) {
                    avatar.textContent = currentUser.username.charAt(0).toUpperCase();
                }
            }
            loadFavorites();

            document.getElementById('navSearch').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const keyword = this.value.trim();
                    if (keyword) {
                        window.location.href = 'index.html?search=' + encodeURIComponent(keyword);
                    }
                }
            });
        })();
    </script>
</body>
</html>
